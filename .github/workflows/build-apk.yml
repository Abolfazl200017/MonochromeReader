name: Build installable debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Google's legacy SDK `tools` package is no longer published.
          # Request only platform-tools; the action installs cmdline-tools itself.
          packages: 'platform-tools'

      - name: Install Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble APK (show compiler errors)
        shell: bash
        run: |
          # Preserve the Gradle exit code while saving its full output.
          set -o pipefail
          exit_code=0
          gradle --no-daemon --console=plain :app:assembleDebug 2>&1 | tee gradle-build.log || exit_code=$?

          if [ "$exit_code" -ne 0 ]; then
            # Kotlin emits "e: file:///...:line:col: ...". Display those
            # diagnostics in the job and on the run's Summary tab.
            echo '::group::Compilation errors and first failure'
            grep -n -E '^e: |^error: |^> Task .* FAILED|^\* What went wrong:|^Execution failed for task|^FAILURE:' gradle-build.log \
              | head -n 100 || true
            echo '::endgroup::'

            {
              echo '## Android build failed'
              echo
              echo 'The first Kotlin `e:` line below usually points to the source file and line to fix.'
              echo
              echo '```text'
              grep -E '^e: |^error: |^> Task .* FAILED|^\* What went wrong:|^Execution failed for task|^FAILURE:' gradle-build.log \
                | head -n 100 || true
              echo '```'
              echo
              echo 'For full context, download the **MonochromeReader-gradle-build-log** artifact.'
            } >> "$GITHUB_STEP_SUMMARY"

            # A missing grep match should not hide the actual build failure.
            exit "$exit_code"
          fi

      - name: Upload Gradle log if the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MonochromeReader-gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: MonochromeReader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
